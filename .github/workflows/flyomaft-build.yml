name: Flyomaft APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: .local/ci-target
      HORIZON_TELEMETRY_URL: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.95.0

      - name: Install Gradle 8.14
        run: |
          wget https://services.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -q gradle-8.14-bin.zip -d "$RUNNER_TEMP"

      - name: Prepare Minecraft resources
        run: |
          mkdir -p .local/android
          python tools/android_prepare.py --version 26.3

      - name: Build Flyomaft APK
        run: |
          python tools/android_build.py \
            --abi arm64-v8a \
            --public \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME" \
            --gradle "$RUNNER_TEMP/gradle-8.14/bin/gradle"

      - name: Rename APK
        run: |
          cp .local/android/apk/arm64-v8a/horizon-android-public.apk \
             .local/android/apk/arm64-v8a/Flyomaft-26.3-arm64-v8a.apk

      - name: Upload Flyomaft APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Flyomaft-26.3-arm64-v8a
          path: .local/android/apk/arm64-v8a/Flyomaft-26.3-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7
